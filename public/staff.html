<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b120d">
<title>Collectors Den — Staff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="staff">
<form id="login" class="login stack" hidden>
  <h2>Staff sign in</h2>
  <label class="field"><span>Email</span><input id="em" type="email" autocomplete="username" required></label>
  <label class="field"><span>Password</span><input id="pw" type="password" autocomplete="current-password" required></label>
  <button id="go" type="submit">Sign in</button>
  <p class="err" id="lerr" role="alert"></p>
</form>
<div id="app" hidden>
  <header class="top"><div><h1>Collectors Den</h1><p id="who"></p></div><button class="alt" id="out" type="button">Sign out</button></header>
  <nav class="tabs" id="tabs" aria-label="Staff sections"></nav>
  <main class="wrap" id="view"></main>
</div>
<script src="common.js"></script>
<script src="staff.js"></script>
</body>
</html>
