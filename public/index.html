<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b120d">
<title>Collectors Den Cafe — Order online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="shop">

<svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-cup" viewBox="0 0 64 64"><path d="M12 26h32v9c0 10-7 17-16 17s-16-7-16-17z" fill="currentColor"/><path d="M44 30h3a6 6 0 0 1 0 12h-4" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M8 57h40" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M22 20c-3-3 3-5 0-9M32 20c-3-3 3-5 0-9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".6"/></symbol>
  <symbol id="i-glass" viewBox="0 0 64 64"><path d="M19 16h26l-3.2 38a4 4 0 0 1-4 3.6H26.200a4 4 0 0 1-4-3.600z" fill="currentColor" opacity=".25"/><path d="M21.500 30h21l-1.700 24a4 4 0 0 1-4 3.600H27.200a4 4 0 0 1-4-3.600z" fill="currentColor"/><path d="M38 5l-4 16" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/><rect x="27" y="33" width="8" height="8" rx="2" fill="#fff" opacity=".35" transform="rotate(12 31 37)"/></symbol>
  <symbol id="i-slice" viewBox="0 0 64 64"><path d="M8 40 56 28v22a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="currentColor"/><path d="M8 40 56 28" stroke="#fff" stroke-width="3" opacity=".45"/><path d="M8 46h48" stroke="#fff" stroke-width="3" opacity=".3"/><circle cx="44" cy="22" r="5" fill="currentColor" opacity=".6"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="hero">
  <nav class="hero-nav" aria-label="Main">
    <span class="brand">Collectors Den</span>
    <a class="link" href="#track">Track an order</a>
  </nav>
  <div class="hero-body">
    <div class="hero-copy">
      <h1>Collectors<br>Den Cafe</h1>
      <p>Order ahead. Pick up when it's ready.</p>
      <div class="hero-cta">
        <a class="btn" href="#menu">Start an order</a>
        <a class="btn ghost" href="#track">Track an order</a>
      </div>
    </div>
    <svg class="cup" viewBox="0 0 480 440" role="img" aria-label="A steaming cup of coffee on a saucer">
      <g class="steam" fill="none" stroke-linecap="round">
        <path class="s s1" d="M196 150c-26-30 26-52 0-92"/>
        <path class="s s2" d="M246 140c-26-30 26-52 0-92"/>
        <path class="s s3" d="M296 150c-26-30 26-52 0-92"/>
      </g>
      <ellipse class="saucer-edge" cx="240" cy="378" rx="196" ry="38"/>
      <ellipse class="saucer" cx="240" cy="366" rx="196" ry="36"/>
      <ellipse class="saucer-well" cx="240" cy="362" rx="120" ry="20"/>
      <path class="handle" d="M372 218c64-6 76 54 26 90-14 10-32 16-50 18" fill="none"/>
      <path class="cup-body" d="M96 196h288v66c0 62-56 106-144 106S96 324 96 262z"/>
      <path class="cup-shade" d="M96 262c0 62 56 106 144 106 30 0 56-5 78-14-26 8-60 12-92 4-52-14-92-46-130-96z"/>
      <ellipse class="rim" cx="240" cy="196" rx="144" ry="28"/>
      <ellipse class="coffee" cx="240" cy="198" rx="128" ry="21"/>
      <path class="art" d="M240 188c-14 0-22 8-22 14s10 8 22 8 22-2 22-8-8-14-22-14zm0 6c8 0 12 4 12 8s-6 4-12 4-12 0-12-4 4-8 12-8z" opacity="0"/>
      <ellipse class="foam" cx="240" cy="198" rx="62" ry="9"/>
      <ellipse class="foam-dot" cx="240" cy="198" rx="26" ry="4"/>
    </svg>
  </div>
</header>

<div class="catbar" id="catbar">
  <nav class="cats" id="cats" aria-label="Menu categories"></nav>
  <button class="cart-btn" id="cartbtn" type="button" aria-label="View your order">
    <svg width="22" height="22" aria-hidden="true"><use href="#i-bag"/></svg>
    <span class="badge" id="count">0</span>
  </button>
</div>

<main class="layout">
  <section id="menu" class="menu" aria-live="polite" aria-label="Menu"><p class="loading">Loading menu…</p></section>

  <aside class="panel" id="panel" aria-label="Your order">
    <div class="panel-head">
      <h2 id="ph" tabindex="-1">Your order</h2>
      <button class="close" id="close" type="button">Close</button>
    </div>

    <div id="cart"></div>

    <form class="checkout stack" id="co" hidden autocomplete="on">
      <label class="field"><span>Your name</span><input id="name" maxlength="60" autocomplete="name" placeholder="So we can call your order"></label>
      <label class="field"><span>Mobile number <em>(optional)</em></span><input id="phone" inputmode="tel" autocomplete="tel" placeholder="09XX XXX XXXX"></label>

      <fieldset class="seg-wrap"><legend>How will you get it?</legend>
        <div class="seg" id="typeseg" role="radiogroup">
          <button type="button" role="radio" aria-checked="true" data-v="pickup">Pickup</button>
          <button type="button" role="radio" aria-checked="false" data-v="dine-in">Dine in</button>
          <button type="button" role="radio" aria-checked="false" data-v="takeout">Takeout</button>
        </div>
        <input type="hidden" id="type" value="pickup">
      </fieldset>

      <fieldset class="seg-wrap"><legend>Pay at the counter with</legend>
        <div class="seg" id="payseg" role="radiogroup">
          <button type="button" role="radio" aria-checked="true" data-v="cash">Cash</button>
          <button type="button" role="radio" aria-checked="false" data-v="gcash">GCash</button>
          <button type="button" role="radio" aria-checked="false" data-v="card">Card</button>
        </div>
        <input type="hidden" id="pay" value="cash">
      </fieldset>

      <button class="btn block" id="place" type="submit">Place order</button>
    </form>

    <div id="done" hidden></div>
    <p class="err" id="err" role="alert"></p>

    <section class="track" aria-labelledby="track">
      <h3 id="track" tabindex="-1">Track your order</h3>
      <div class="trackrow">
        <input id="tcode" placeholder="Order code, e.g. CD-1234-ab12" aria-label="Order code" autocomplete="off">
        <button class="alt" id="tbtn" type="button">Check</button>
      </div>
      <div id="tout" aria-live="polite"></div>
    </section>
  </aside>
</main>

<footer class="foot">
  <span>Collectors Den Cafe</span>
  <a href="/staff">Staff sign in</a>
</footer>

<button class="bar" id="bar" type="button" hidden>
  <span class="bar-n"><b id="bn">0</b> items</span>
  <span class="bar-go">View order</span>
  <b id="bt">₱0.00</b>
</button>

<script src="common.js"></script>
<script src="shop.js"></script>
</body>
</html>
