apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: den-data, namespace: collectors-den}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: den, namespace: collectors-den}
spec:
  replicas: 1            # SQLite = single writer. Keep at 1.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: den}}
  template:
    metadata: {labels: {app: den}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: den
          image: ghcr.io/YOUR_GITHUB_USER/collectors-den:latest
          ports: [{containerPort: 3000}]
          envFrom: [{secretRef: {name: den-secrets}}]
          readinessProbe: {httpGet: {path: /api/menu, port: 3000}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /api/menu, port: 3000}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: den-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: den, namespace: collectors-den}
spec:
  selector: {app: den}
  ports: [{port: 80, targetPort: 3000}]
